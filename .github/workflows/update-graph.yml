name: Generate Diffusion Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Generate Graph
        env:
          # We renamed these to avoid system conflicts
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: python generate_diffusion.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # We check if the file exists before adding to avoid the "pathspec" error
          if [ -f diffusion_graph.svg ]; then
            git add diffusion_graph.svg
            git commit -m "Update diffusion graph" || exit 0
            git push
          else
            echo "Error: diffusion_graph.svg was not generated."
            exit 1
          fi